name: Daily collect

on:
  schedule:
    # Midnight US Eastern (05:00 UTC during EDT, 04:00 UTC during EST)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/odds
            data/signals
          key: chalkiq-data-v2
          restore-keys: chalkiq-data-v2

      - name: Run daily pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMS_BRIEFING_TO: "5128508472"
          SMS_CARRIER: "att"
        run: python scripts/daily_collect.py

      - name: Commit landing assets
        run: |
          git config user.name "chalkiq-bot"
          git config user.email "bot@chalkiq.com"
          git add web/assets/data.json || true
          if git diff --staged --quiet; then
            echo "No landing asset changes"
          else
            git commit -m "chore: update landing page data from daily collect"
            git push
          fi
