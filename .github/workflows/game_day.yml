name: Game day odds

on:
  schedule:
    # Fri–Mon: every 2 hours during US game windows (17–05 UTC)
    - cron: "0 17,19,21,23,1,3,5 * * 5,6,0,1"
  workflow_dispatch:

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/odds
            data/signals
          key: chalkiq-data-v2
          restore-keys: chalkiq-data-v2

      - name: Poll odds + refresh newsletter
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMS_BRIEFING_TO: "5128508472"
          SMS_CARRIER: "att"
        run: python scripts/daily_collect.py --game-day
